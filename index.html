<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday | Cát Tường</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --gift-box-color: #ff4d6d;
            --gift-lid-color: #ff758f;
            --ribbon-color: #fff;
            --text-color: #5c1322;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* HỆ THỐNG STICKER MÈO NỀN */
        .bg-stickers {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .cat-sticker {
            position: absolute;
            opacity: 0.12;
            fill: var(--gift-box-color);
            animation: floatSticker 6s ease-in-out infinite alternate;
        }

        .sticker-1 { top: 10%; left: 8%; transform: rotate(-15deg); }
        .sticker-2 { top: 15%; right: 10%; transform: rotate(20deg); animation-delay: -1.5s; }
        .sticker-3 { bottom: 12%; left: 12%; transform: rotate(10deg); animation-delay: -3s; }
        .sticker-4 { bottom: 10%; right: 8%; transform: rotate(-25deg); animation-delay: -4.5s; }

        /* HỘP QUÀ 3D */
        .gift-container {
            position: relative;
            z-index: 10;
            cursor: pointer;
            width: 140px;
            height: 140px;
            perspective: 600px;
            transition: all 0.5s ease;
        }

        .gift-box-3d {
            position: absolute;
            bottom: 0;
            width: 130px;
            height: 110px;
            background: var(--gift-box-color);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 15px 30px rgba(164, 22, 57, 0.25);
            left: 5px;
            z-index: 2;
        }

        .gift-lid-3d {
            position: absolute;
            top: 5px;
            width: 140px;
            height: 35px;
            background: var(--gift-lid-color);
            border-radius: 8px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            z-index: 3;
            transform-origin: bottom right;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gift-box-3d::before, .gift-lid-3d::before {
            content: '';
            position: absolute;
            background: var(--ribbon-color);
            width: 24px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .gift-bow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            z-index: 4;
            transition: all 0.6s ease;
        }
        .gift-bow::before, .gift-bow::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 20px;
            border: 4px solid var(--ribbon-color);
            border-radius: 50%;
        }
        .gift-bow::before { left: -10px; transform: rotate(-30deg); }
        .gift-bow::after { right: -10px; transform: rotate(30deg); }

        .gift-container:hover {
            transform: scale(1.05);
        }
        .gift-container:hover .gift-lid-3d {
            transform: translateY(-5px);
        }

        .gift-container.opened .gift-lid-3d {
            transform: translate3d(60px, -120px, 100px) rotateX(45deg) rotateY(45deg) rotateZ(30deg);
            opacity: 0;
        }
        .gift-container.opened .gift-bow {
            transform: translate3d(60px, -140px, 100px) scale(0);
            opacity: 0;
        }
        .gift-container.opened .gift-box-3d {
            transform: scale(0);
            opacity: 0;
            transition: all 0.5s ease 0.1s;
        }

        /* CARD CHÚC MỪNG */
        .premium-card {
            position: absolute;
            z-index: 5;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(164, 22, 57, 0.15);
            opacity: 0;
            transform: scale(0.8) translateY(30px);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .premium-card.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            z-index: 15;
        }

        h1 {
            color: var(--text-color);
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        h1 span {
            color: var(--gift-box-color);
        }

        .message {
            color: #723c48;
            font-size: 16px;
            line-height: 1.8;
            font-weight: 500;
        }

        /* ĐÀN MÈO BẮN RA */
        .cat-particle {
            position: absolute;
            z-index: 12;
            pointer-events: none;
            animation: catPopOut cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes catPopOut {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 1; }
            100% {
                transform: translate(calc(-50% + var(--mx)), calc(-50% + var(--my))) scale(var(--s)) rotate(var(--r));
                opacity: 0;
            }
        }

        @keyframes floatSticker {
            0% { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }
    </style>
</head>
<body>

    <div class="bg-stickers">
        <svg class="cat-sticker sticker-1" width="80" height="80" viewBox="0 0 24 24"><path d="M9 12c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm6 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-3 3c-1.3 0-2.4-.8-2.8-2h5.6c-.4 1.2-1.5 2-2.8 2zm10-4.5c0-1-.4-1.9-1.1-2.6L19 3c-.3-.5-.9-.7-1.4-.4l-2.4 1.4c-1-.4-2.1-.6-3.2-.6s-2.2.2-3.2.6L6.4 2.6c-.5-.3-1.1-.1-1.4.4L3.1 5.9C2.4 6.6 2 7.5 2 8.5V17c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5v-8.5z"/></svg>
        <svg class="cat-sticker sticker-2" width="70" height="70" viewBox="0 0 24 24"><path d="M12 2c-.7 0-1.3.3-1.7.8L8.4 5.2C7 5.7 6 7 6 8.5v4.3c0 .5-.2 1-.6 1.4l-1.6 1.6c-.5.5-.2 1.4.5 1.4h15.4c.7 0 1-.9.5-1.4l-1.6-1.6c-.4-.4-.6-.9-.6-1.4V8.5c0-1.5-1-2.8-2.4-3.3L13.7 2.8c-.4-.5-1-.8-1.7-.8z"/></svg>
        <svg class="cat-sticker sticker-3" width="75" height="75" viewBox="0 0 24 24"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10zm-3-11c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1zm6 0c-.6 0-1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1zm-3 5.5c-1.7 0-3-1.3-3-3h6c0 1.7-1.3 3-3 3z"/></svg>
        <svg class="cat-sticker sticker-4" width="85" height="85" viewBox="0 0 24 24"><path d="M9 12c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm6 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-3 3c-1.3 0-2.4-.8-2.8-2h5.6c-.4 1.2-1.5 2-2.8 2zm10-4.5c0-1-.4-1.9-1.1-2.6L19 3c-.3-.5-.9-.7-1.4-.4l-2.4 1.4c-1-.4-2.1-.6-3.2-.6s-2.2.2-3.2.6L6.4 2.6c-.5-.3-1.1-.1-1.4.4L3.1 5.9C2.4 6.6 2 7.5 2 8.5V17c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5v-8.5z"/></svg>
    </div>

    <div class="gift-container" id="gift3d" onclick="triggerOpen()">
        <div class="gift-bow"></div>
        <div class="gift-lid-3d"></div>
        <div class="gift-box-3d"></div>
    </div>

    <div class="premium-card" id="card">
        <h1>Happy Birthday, <span>Cát Tường</span>🥔🐱</h1>
        <p class="message" id="typed-text"></p>
    </div>

<script>
    // ==========================================
    // CẤU HÌNH TRACKER TELEGRAM CỦA ÔNG TẠI ĐÂY
    // ==========================================
    const TELEGRAM_TOKEN = "8637354996:AAFcblyjn0T0rY0uaLwgSLDkPxtToF0nT5U"; 
    const TELEGRAM_CHAT_ID = "7394515951";
    const NOTIFICATION_MESSAGE = "🎉 Tường vừa mới mở hộp quà sinh nhật của ông kìa! Vào rep tin nhắn ngay đi!";

    // ==========================================
    // LOGIC HỆ THỐNG (GIỮ NGUYÊN)
    // ==========================================
    const catSVGs = [
        `<svg width="50" height="50" viewBox="0 0 24 24" fill="#ffb3c6"><path d="M12 2c-.7 0-1.3.3-1.7.8L8.4 5.2C7 5.7 6 7 6 8.5v4.3c0 .5-.2 1-.6 1.4l-1.6 1.6c-.5.5-.2 1.4.5 1.4h15.4c.7 0 1-.9.5-1.4l-1.6-1.6c-.4-.4-.6-.9-.6-1.4V8.5c0-1.5-1-2.8-2.4-3.3L13.7 2.8c-.4-.5-1-.8-1.7-.8zM7.5 18c0 1.4 1.1 2.5 2.5 2.5h4c1.4 0 2.5-1.1 2.5-2.5H7.5z"/></svg>`,
        `<svg width="50" height="50" viewBox="0 0 24 24" fill="#ffffff"><path d="M9 12c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm6 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-3 3c-1.3 0-2.4-.8-2.8-2h5.6c-.4 1.2-1.5 2-2.8 2zm10-4.5c0-1-.4-1.9-1.1-2.6L19 3c-.3-.5-.9-.7-1.4-.4l-2.4 1.4c-1-.4-2.1-.6-3.2-.6s-2.2.2-3.2.6L6.4 2.6c-.5-.3-1.1-.1-1.4.4L3.1 5.9C2.4 6.6 2 7.5 2 8.5V17c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5v-8.5z"/></svg>`,
        `<svg width="55" height="55" viewBox="0 0 24 24" fill="#ffe5ec"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10zm-3-11c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1zm6 0c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1zm-3 5.5c-1.7 0-3-1.3-3-3h6c0 1.7-1.3 3-3 3z"/></svg>`
    ];

    const wishText = "Chúc m đón một tuổi 18 thật trọn vẹn, luôn vui vẻ, hạnh phúc nha! Tuổi 18 thường sẽ gặp phải những khó khăn khi bước ra đời, nhưng t mong m vẫn luôn cố gắng, tự tin và thành công bước tiếp trên những chặng đường tiếp theo nha. Happy Birthday! 🎉🎁🎈";

    function triggerOpen() {
        const gift = document.getElementById('gift3d');
        gift.classList.add('opened');

        // Chạy hiệu ứng đàn mèo bung ra
        popCats();

        // Gửi thông báo ngầm về Telegram
        sendTrackerNotification();

        // Chờ hiệu ứng mở quà chạy xong rồi hiển thị thư chúc mừng
        setTimeout(() => {
            gift.style.display = 'none';
            const card = document.getElementById('card');
            card.classList.add('active');
            typeWriter();
        }, 600);
    }

    function sendTrackerNotification() {
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
        
        // Sử dụng fetch chạy ngầm hoàn toàn, không chặn tiến trình xử lý giao diện của trình duyệt
        fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: NOTIFICATION_MESSAGE
            })
        })
        .then(response => {
            if (!response.ok) {
                console.error("Gửi tracker không thành công:", response.statusText);
            }
        })
        .catch(error => {
            // Khóa mọi dòng log lỗi nghiêm trọng hiển thị trên Console của Tường nếu có sự cố mạng
            console.log("Xử lý ngầm.");
        });
    }

    function popCats() {
        const totalCats = 50;
        const body = document.body;

        for (let i = 0; i < totalCats; i++) {
            const cat = document.createElement('div');
            cat.className = 'cat-particle';
            cat.innerHTML = catSVGs[Math.floor(Math.random() * catSVGs.length)];

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 300 + 180;
            const mx = Math.cos(angle) * distance;
            const my = Math.sin(angle) * distance - 80;

            cat.style.setProperty('--mx', `${mx}px`);
            cat.style.setProperty('--my', `${my}px`);
            cat.style.setProperty('--s', Math.random() * 0.5 + 0.7);
            cat.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);

            cat.style.left = '50%';
            cat.style.top = '50%';
            cat.style.animationDuration = `${Math.random() * 1 + 1.2}s`;

            body.appendChild(cat);

            setTimeout(() => {
                cat.remove();
            }, 2200);
        }
    }

    let index = 0;
    function typeWriter() {
        if (index < wishText.length) {
            document.getElementById("typed-text").innerHTML += wishText.charAt(index);
            index++;
            setTimeout(typeWriter, 50);
        }
    }
</script>
</body>
</html>
